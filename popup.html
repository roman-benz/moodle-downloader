<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; width: 360px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px 0; }
    button { width: 100%; padding: 10px; margin: 8px 0; cursor: pointer; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .row { margin: 8px 0; }
    #status { font-size: 12px; opacity: 0.85; margin-top: 6px; }
    ul { max-height: 170px; overflow: auto; padding-left: 18px; margin: 8px 0 0 0; }
    li { font-size: 12px; margin: 3px 0; }
    .hint { font-size: 12px; opacity: 0.75; }
  </style>
</head>
<body>
  <h1>Moodle Downloader</h1>

  <div class="row">
    <div class="hint">Zielordner (unter Downloads):</div>
    <input id="folder" type="text" placeholder="Moodle-Kurs" />
  </div>

  <button id="scan">1) Scan aktuelle Seite</button>
  <button id="download" disabled>2) Download alle Dateien</button>

  <div id="status"></div>
  <ul id="list"></ul>

  <script src="popup.js"></script>
</body>
</html>
